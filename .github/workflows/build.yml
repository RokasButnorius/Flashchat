name: Build and Release FlashChat Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r client-desktop/requirements.txt

      - name: Generate Version File
        shell: powershell
        run: |
          $versionContent = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(0, 1, 0, 0),
              prodvers=(0, 1, 0, 0),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo(
                [
                  StringTable(
                    '040904B0',
                    [
                      StringStruct('CompanyName', 'Rokas Butnorius Software'),
                      StringStruct('FileDescription', 'E2EE Messaging & Calling'),
                      StringStruct('FileVersion', '0.1.0.0'),
                      StringStruct('InternalName', 'FlashChat'),
                      StringStruct('LegalCopyright', 'Copyright (c) 2026 Rokas Butnorius'),
                      StringStruct('OriginalFilename', 'FlashChat.exe'),
                      StringStruct('ProductName', 'FlashChat'),
                      StringStruct('ProductVersion', '0.1.0.0')
                    ]
                  )
                ]
              ),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@
          Set-Content -Path "client-desktop/version_generated.txt" -Value $versionContent -Encoding ASCII

      - name: Build EXE with PyInstaller
        run: |
          cd client-desktop
          pyinstaller --noconsole --onefile --version-file=version_generated.txt --add-data "crypto;crypto" --add-data "network;network" --name "FlashChat.exe" main_desktop.py

      - name: Self-Sign Executable
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Rokas Butnorius Software" -CertStoreLocation Cert:\CurrentUser\My
          signtool sign /fd SHA256 /sha1 $cert.Thumbprint "client-desktop/dist/FlashChat.exe"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: client-desktop/dist/FlashChat.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
