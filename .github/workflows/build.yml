name: Build and Release FlashChat Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false # Fixes 'git exit code 128' warning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 -r client-desktop/requirements.txt # Installs PySide6 automatically

      - name: Build EXE with PyInstaller
        run: |
          cd client-desktop
          if (Test-Path "FlashChat.exe.spec") { Remove-Item "FlashChat.exe.spec" } # Starts clean
          pyinstaller --noconsole --onefile --icon="logo.ico" --hidden-import=PySide6 --add-data "crypto;crypto" --add-data "network;network" --add-data "logo.ico;." --name "FlashChat.exe" main_desktop.py

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: client-desktop/dist/FlashChat.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}