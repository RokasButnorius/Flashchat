name: Build Desktop Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r client-desktop/requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name="FlashChat" `
            --icon="client-desktop/logo.ico" `
            --collect-all "aiortc" `
            --collect-all "av" `
            --collect-all "PySide6" `
            --copy-metadata "aiortc" `
            --copy-metadata "av" `
            client-desktop/main_desktop.py

      - name: Compress Build Artifact
        run: |
          powershell Compress-Archive -Path dist/FlashChat/* -DestinationPath dist/FlashChat-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/FlashChat-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}