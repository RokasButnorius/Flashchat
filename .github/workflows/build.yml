name: Build and Release FlashChat Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r client-desktop/requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          cd client-desktop
          if (Test-Path "FlashChat.exe.spec") { Remove-Item "FlashChat.exe.spec" }
          pyinstaller --noconsole --onefile --add-data "crypto;crypto" --add-data "network;network" --name "FlashChat.exe" main_desktop.py

      - name: Self-Sign Executable
        shell: powershell
        run: |
          # 1. Locate signtool.exe in Windows SDK
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          
          # 2. Create self-signed cert
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Rokas Butnorius Software" -CertStoreLocation Cert:\CurrentUser\My
          
          # 3. Sign the binary using located signtool
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint "client-desktop/dist/FlashChat.exe"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: client-desktop/dist/FlashChat.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}