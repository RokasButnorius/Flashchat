<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Privacy Messenger</title>
<style>
  :root {
    --bg-deepest: #1a1d24;
    --bg-sidebar: #20232b;
    --bg-chat: #262a33;
    --bg-input: #35393f;
    --bg-hover: #2e323b;
    --accent: #6e7bff;
    --accent-bright: #8891ff;
    --online: #3ba55d;
    --danger: #ed4245;
    --text-main: #e6e7ea;
    --text-muted: #8a8f98;
    --text-dim: #5c6068;
    --font: -apple-system, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg-deepest);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 240px;
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    border-right: 1px solid #14161b;
  }
  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid #14161b;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #sidebar-header .lock { color: var(--accent-bright); font-size: 18px; }
  #sidebar-header .title { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; }
  #identity-badge {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid #14161b;
  }
  #identity-badge b { color: var(--text-main); }
  #dm-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 8px;
  }
  #dm-list .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    padding: 8px 8px 4px;
    text-transform: uppercase;
  }
  .contact {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 14px;
  }
  .contact:hover { background: var(--bg-hover); color: var(--text-main); }
  .contact.active { background: var(--accent); color: white; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #4a3fd6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: white; flex-shrink: 0;
    position: relative;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--online);
    border: 2px solid var(--bg-sidebar);
    position: absolute; bottom: -2px; right: -2px;
  }
  #add-contact {
    padding: 10px;
    border-top: 1px solid #14161b;
  }
  #add-contact input {
    width: 100%;
    background: var(--bg-input);
    border: none;
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text-main);
    font-size: 13px;
    outline: none;
  }
  #add-contact input:focus { outline: 2px solid var(--accent); }

  #conn-status {
    padding: 8px 16px;
    font-size: 11px;
    display: flex; align-items: center; gap: 6px;
    border-top: 1px solid #14161b;
  }
  #conn-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  #conn-status.connected .dot { background: var(--online); }

  /* ---------- Main panel ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header {
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid #14161b;
    background: var(--bg-chat);
    flex-shrink: 0;
  }
  #chat-header .peer-name { font-weight: 700; font-size: 15px; }
  #chat-header .peer-sub { font-size: 11px; color: var(--text-muted); }
  #call-controls { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--bg-input); border: none; color: var(--text-main);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: background 0.15s;
  }
  .icon-btn:hover { background: var(--bg-hover); }
  .icon-btn.active { background: var(--accent); }
  .icon-btn.danger { background: var(--danger); }
  .icon-btn.danger:hover { background: #c62d30; }

  #call-stage {
    display: none;
    background: #101216;
    padding: 12px;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    border-bottom: 1px solid #14161b;
  }
  #call-stage.live { display: flex; }
  .video-tile {
    position: relative;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    width: 320px; height: 200px;
  }
  .video-tile video { width: 100%; height: 100%; object-fit: cover; }
  .video-tile .tag {
    position: absolute; bottom: 6px; left: 8px;
    font-size: 11px; background: rgba(0,0,0,0.6);
    padding: 3px 8px; border-radius: 5px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #messages .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  .msg {
    display: flex;
    gap: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    max-width: 640px;
  }
  .msg:hover { background: rgba(255,255,255,0.02); }
  .msg .avatar { width: 28px; height: 28px; font-size: 11px; margin-top: 2px; }
  .msg .body { display: flex; flex-direction: column; }
  .msg .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
  .msg .meta b { color: var(--text-main); font-size: 13px; }
  .msg .text { font-size: 14px; line-height: 1.4; color: var(--text-main); }
  .msg.mine { align-self: flex-end; flex-direction: row-reverse; text-align: right; }
  .msg.mine .body { align-items: flex-end; }
  .msg.system .text { color: var(--text-dim); font-style: italic; font-size: 12px; }

  #composer {
    padding: 12px 16px 16px;
    flex-shrink: 0;
  }
  #composer form {
    display: flex; gap: 8px;
    background: var(--bg-input);
    border-radius: 10px;
    padding: 4px;
  }
  #composer input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text-main); font-size: 14px; padding: 10px 12px;
  }
  #composer button {
    background: var(--accent); border: none; color: white;
    border-radius: 8px; padding: 0 18px; cursor: pointer; font-weight: 600;
    font-size: 13px;
  }
  #composer button:hover { background: var(--accent-bright); }
  #composer button:disabled { background: var(--bg-hover); color: var(--text-dim); cursor: not-allowed; }

  #no-peer-notice {
    padding: 40px; text-align: center; color: var(--text-dim); margin: auto;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3e46; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <span class="lock">🔒</span>
      <span class="title">Privacy Messenger</span>
    </div>
    <div id="identity-badge">Signed in as <b id="my-id-label">—</b></div>

    <div id="dm-list">
      <div class="section-label">Direct Messages</div>
      <div id="contacts"></div>
    </div>

    <div id="add-contact">
      <input id="add-contact-input" placeholder="Add user by ID + Enter" />
    </div>
    <div id="conn-status"><span class="dot"></span><span id="conn-status-text">disconnected</span></div>
  </div>

  <div id="main">
    <div id="chat-header">
      <div>
        <div class="peer-name" id="peer-name">Select a contact</div>
        <div class="peer-sub" id="peer-sub"></div>
      </div>
      <div id="call-controls">
        <button class="icon-btn" id="btn-voice" title="Voice call">📞</button>
        <button class="icon-btn" id="btn-video" title="Video call">🎥</button>
        <button class="icon-btn" id="btn-screen" title="Share screen">🖥️</button>
        <button class="icon-btn danger" id="btn-hangup" title="Hang up" style="display:none">✕</button>
      </div>
    </div>

    <div id="call-stage"></div>

    <div id="messages"><div class="empty-state">No conversation selected yet.</div></div>

    <div id="composer">
      <form id="composer-form">
        <input id="composer-input" placeholder="Message..." autocomplete="off" disabled />
        <button type="submit" disabled>Send</button>
      </form>
    </div>
  </div>
</div>

<script>
/* ===========================================================
   Privacy Messenger - Web Client
   Talks to the same Python relay server used by client.py,
   over the same WebSocket protocol (see shared/protocol.py).

   NOTE (honest tradeoff, flagged deliberately):
   The Python CLI client uses full X3DH + Double Ratchet E2EE.
   Porting that exact ratchet to JS is a follow-up task. For
   THIS pass, text chat here is relayed as-is (not yet E2E
   encrypted from this web client) so you have a working UI +
   calling stack today. WebRTC audio/video/screen share IS
   properly end-to-end encrypted by DTLS-SRTP (built into
   WebRTC itself) regardless -- that part is already secure.
   Wire real E2EE text encryption in as the next step.
   =========================================================== */

const RELAY_URL = "wss://relay.flashchat.store";
const STUN_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];

let ws = null;
let myId = null;
let activePeer = null;
let contacts = new Set();
let messagesByPeer = {};

let pc = null;               // RTCPeerConnection for active call
let localStream = null;
let screenStream = null;
let callPeer = null;
let callActive = false;

const $ = (sel) => document.querySelector(sel);

// ---------- boot ----------
function boot() {
  myId = prompt("Enter your user ID:", "user_" + Math.floor(Math.random() * 1000));
  if (!myId) return;
  $("#my-id-label").textContent = myId;
  connect();
}

function connect() {
  ws = new WebSocket(RELAY_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "hello", user_id: myId }));
    setConnStatus(true);
  };
  ws.onclose = () => setConnStatus(false);
  ws.onerror = () => setConnStatus(false);
  ws.onmessage = (evt) => handleServerMessage(JSON.parse(evt.data));
}

function setConnStatus(ok) {
  const el = $("#conn-status");
  el.classList.toggle("connected", ok);
  $("#conn-status-text").textContent = ok ? "connected to relay" : "disconnected";
}

// ---------- contacts / sidebar ----------
$("#add-contact-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const id = e.target.value.trim();
    if (id && id !== myId) addContact(id);
    e.target.value = "";
  }
});

function addContact(id) {
  if (contacts.has(id)) { selectPeer(id); return; }
  contacts.add(id);
  messagesByPeer[id] = messagesByPeer[id] || [];
  renderContacts();
  selectPeer(id);
}

function renderContacts() {
  const wrap = $("#contacts");
  wrap.innerHTML = "";
  [...contacts].forEach((id) => {
    const div = document.createElement("div");
    div.className = "contact" + (id === activePeer ? " active" : "");
    div.innerHTML = `
      <div class="avatar">${initials(id)}<span class="status-dot"></span></div>
      <span>${escapeHtml(id)}</span>`;
    div.onclick = () => selectPeer(id);
    wrap.appendChild(div);
  });
}

function selectPeer(id) {
  activePeer = id;
  $("#peer-name").textContent = id;
  $("#peer-sub").textContent = "direct message · not yet E2E-encrypted in web client (see note in source)";
  $("#composer-input").disabled = false;
  $("#composer-form button").disabled = false;
  renderContacts();
  renderMessages();
}

function initials(id) { return id.slice(0, 2).toUpperCase(); }
function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

// ---------- messaging ----------
$("#composer-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("#composer-input");
  const text = input.value.trim();
  if (!text || !activePeer) return;
  sendChatMessage(activePeer, text);
  input.value = "";
});

function sendChatMessage(to, text) {
  const envelope = {
    envelope_id: crypto.randomUUID(),
    sender_id: myId,
    recipient_id: to,
    ciphertext: btoa(unescape(encodeURIComponent(text))), // placeholder transport encoding, NOT encryption -- see note above
    header: JSON.stringify({ plaintext_demo: true }),
    is_prekey_message: false,
  };
  ws.send(JSON.stringify({ type: "send_message", envelope }));
  pushMessage(to, { from: myId, text, mine: true });
}

function pushMessage(peer, msg) {
  messagesByPeer[peer] = messagesByPeer[peer] || [];
  messagesByPeer[peer].push(msg);
  if (peer === activePeer) renderMessages();
}

function renderMessages() {
  const wrap = $("#messages");
  const list = messagesByPeer[activePeer] || [];
  if (list.length === 0) {
    wrap.innerHTML = `<div class="empty-state">No messages yet with ${escapeHtml(activePeer)}. Say hi 👋</div>`;
    return;
  }
  wrap.innerHTML = "";
  list.forEach((m) => {
    const div = document.createElement("div");
    if (m.system) {
      div.className = "msg system";
      div.innerHTML = `<div class="text">${escapeHtml(m.text)}</div>`;
    } else {
      div.className = "msg" + (m.mine ? " mine" : "");
      div.innerHTML = `
        <div class="avatar">${initials(m.from)}</div>
        <div class="body">
          <div class="meta"><b>${escapeHtml(m.from)}</b></div>
          <div class="text">${escapeHtml(m.text)}</div>
        </div>`;
    }
    wrap.appendChild(div);
  });
  wrap.scrollTop = wrap.scrollHeight;
}

// ---------- server message router ----------
function handleServerMessage(msg) {
  switch (msg.type) {
    case "incoming_message": {
      const env = msg.envelope;
      addContact(env.sender_id);
      let text;
      try { text = decodeURIComponent(escape(atob(env.ciphertext))); }
      catch { text = "[unreadable message]"; }
      pushMessage(env.sender_id, { from: env.sender_id, text, mine: false });
      ws.send(JSON.stringify({ type: "ack", envelope_id: env.envelope_id }));
      break;
    }
    case "rtc_offer":   handleRemoteOffer(msg); break;
    case "rtc_answer":  handleRemoteAnswer(msg); break;
    case "rtc_ice_candidate": handleRemoteIce(msg); break;
    case "error": console.warn("relay error:", msg.reason); break;
  }
}

// =========================================================
// WebRTC: voice / video calling + screen share
// Signaling rides over the same websocket relay (server just
// forwards rtc_* messages blind -- see server.py). Media itself
// is end-to-end encrypted by WebRTC's built-in DTLS-SRTP.
// =========================================================

function newPeerConnection(remoteId) {
  const conn = new RTCPeerConnection({ iceServers: STUN_SERVERS });
  conn.onicecandidate = (e) => {
    if (e.candidate) {
      ws.send(JSON.stringify({
        type: "rtc_ice_candidate", to_user: remoteId, from_user: myId,
        payload: JSON.stringify(e.candidate),
      }));
    }
  };
  conn.ontrack = (e) => {
    showRemoteVideo(remoteId, e.streams[0]);
  };
  conn.onconnectionstatechange = () => {
    if (["disconnected", "failed", "closed"].includes(conn.connectionState)) {
      endCall(false);
    }
  };
  return conn;
}

async function startCall(withVideo) {
  if (!activePeer) { alert("Select a contact first."); return; }
  if (callActive) return;
  callPeer = activePeer;
  callActive = true;
  $("#btn-hangup").style.display = "flex";

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: withVideo });
  showLocalVideo(localStream);

  pc = newPeerConnection(callPeer);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({
    type: "rtc_offer", to_user: callPeer, from_user: myId,
    payload: JSON.stringify(offer),
  }));
  pushMessage(callPeer, { system: true, text: `Calling ${callPeer}...` });
}

async function handleRemoteOffer(msg) {
  const remoteId = msg.from_user;
  addContact(remoteId);
  const accept = confirm(`Incoming call from ${remoteId}. Accept?`);
  if (!accept) return;

  callPeer = remoteId;
  callActive = true;
  $("#btn-hangup").style.display = "flex";
  selectPeer(remoteId);

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
  showLocalVideo(localStream);

  pc = newPeerConnection(remoteId);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

  const offer = JSON.parse(msg.payload);
  await pc.setRemoteDescription(offer);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  ws.send(JSON.stringify({
    type: "rtc_answer", to_user: remoteId, from_user: myId,
    payload: JSON.stringify(answer),
  }));
  pushMessage(remoteId, { system: true, text: `Call connected with ${remoteId}` });
}

async function handleRemoteAnswer(msg) {
  if (!pc) return;
  const answer = JSON.parse(msg.payload);
  await pc.setRemoteDescription(answer);
  pushMessage(callPeer, { system: true, text: `Call connected with ${callPeer}` });
}

async function handleRemoteIce(msg) {
  if (!pc) return;
  try {
    const cand = JSON.parse(msg.payload);
    if (cand.hangup) { endCall(false); return; }
    await pc.addIceCandidate(cand);
  } catch (e) { console.warn("ICE add failed", e); }
}

async function startScreenShare() {
  if (!pc) { alert("Start a call first, then share your screen."); return; }
  screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
  const screenTrack = screenStream.getVideoTracks()[0];
  const sender = pc.getSenders().find((s) => s.track && s.track.kind === "video");
  if (sender) await sender.replaceTrack(screenTrack);
  showLocalVideo(screenStream, true);
  $("#btn-screen").classList.add("active");

  screenTrack.onended = () => stopScreenShare();
}

async function stopScreenShare() {
  if (!pc || !localStream) return;
  const camTrack = localStream.getVideoTracks()[0];
  const sender = pc.getSenders().find((s) => s.track && s.track.kind === "video");
  if (sender && camTrack) await sender.replaceTrack(camTrack);
  showLocalVideo(localStream);
  $("#btn-screen").classList.remove("active");
  if (screenStream) screenStream.getTracks().forEach((t) => t.stop());
  screenStream = null;
}

function endCall(notifyPeer = true) {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  if (screenStream) { screenStream.getTracks().forEach((t) => t.stop()); screenStream = null; }
  $("#call-stage").innerHTML = "";
  $("#call-stage").classList.remove("live");
  $("#btn-hangup").style.display = "none";
  $("#btn-screen").classList.remove("active");
  if (callPeer) pushMessage(callPeer, { system: true, text: "Call ended" });
  callActive = false;
  callPeer = null;
}

function showLocalVideo(stream, isScreen = false) {
  let tile = $("#tile-local");
  if (!tile) {
    tile = document.createElement("div");
    tile.className = "video-tile";
    tile.id = "tile-local";
    tile.innerHTML = `<video autoplay muted playsinline></video><span class="tag">You${isScreen ? " (screen)" : ""}</span>`;
    $("#call-stage").appendChild(tile);
    $("#call-stage").classList.add("live");
  }
  tile.querySelector("video").srcObject = stream;
  tile.querySelector(".tag").textContent = isScreen ? "You (screen)" : "You";
}

function showRemoteVideo(peerId, stream) {
  let tile = $("#tile-remote");
  if (!tile) {
    tile = document.createElement("div");
    tile.className = "video-tile";
    tile.id = "tile-remote";
    tile.innerHTML = `<video autoplay playsinline></video><span class="tag"></span>`;
    $("#call-stage").appendChild(tile);
    $("#call-stage").classList.add("live");
  }
  tile.querySelector("video").srcObject = stream;
  tile.querySelector(".tag").textContent = peerId;
}

// ---------- button wiring ----------
$("#btn-voice").onclick = () => startCall(false);
$("#btn-video").onclick = () => startCall(true);
$("#btn-screen").onclick = () => {
  if ($("#btn-screen").classList.contains("active")) stopScreenShare();
  else startScreenShare();
};
$("#btn-hangup").onclick = () => {
  if (callPeer) {
    ws.send(JSON.stringify({ type: "rtc_ice_candidate", to_user: callPeer, from_user: myId, payload: JSON.stringify({ hangup: true }) }));
  }
  endCall();
};

boot();
</script>
</body>
</html>
